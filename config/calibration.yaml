# 相机标定全流程算法参数的唯一来源(D-12)
#
# 硬性规则:
# - 命令行不接受任何算法参数,所有默认值集中在本文件;
# - 换数据集/换棋盘规格只改配置不改代码;
# - 阈值类初值来自标准做法,首轮真实数据分布出来后由迭代回环校准(D-04):
#   人工审阅废帧清单 → 调整本文件 → 重跑受影响环节,每轮结果按时间戳留痕、跨轮可比。

# ---- 数据位置(相对当前工作目录)----
data:
  train: "input_data/train"   # 训练照片:每姿态一个子目录,目录名即姿态 ID
  test: "input_data/test"     # 测试照片:平铺,每张独立

# ---- 全局 ----
seed: 42                      # 随机种子(交叉验证切分、bootstrap 等),保证同配置可复现
cv2_threads: 0                # OpenCV 内部线程数;0 = 关闭 OpenCV 自己的多线程,
                              # 防止批量处理时占满所有核(并行交给上层显式控制)

# 人工剔除清单(D-03):input_data 只读,剔除永远是逻辑剔除。
# 人工审阅角点叠加图/废帧清单后,把要剔除的 image_id(文件名去扩展名)填在这里;
# 程序只在计算时跳过这些照片,绝不改动原始数据。
exclude_images: []

# ---- 第①步:入库体检 ----
ingest:
  precheck:
    # 模糊度:同姿态连拍内做稳健 z 分数(中位数绝对差 MAD,即用中位数衡量的偏离程度),
    # |z| 超过阈值判存疑。初值 3.5 来自统计惯例(约千分之二误报率),待首轮分布校准。
    blur_z_threshold: 3.5
    # 全局兜底分位线(单张姿态没有连拍可比,靠整批分位数兜底):
    # 指标低于 1% 分位或高于 99% 分位的照片标记存疑。初值待首轮分布校准。
    global_quantile_low: 0.01
    global_quantile_high: 0.99

# ---- 第②步:找棋盘角点 ----
corners:
  # 经典检测器 findChessboardCorners 的选项(按名字开,代码内翻译成 cv2 常量):
  # adaptive_thresh = 自适应阈值(光照不均时更稳);normalize_image = 先归一化亮度
  classic_flags: [adaptive_thresh, normalize_image]
  sb_flags: 0                  # 新款检测器 findChessboardCornersSB 的选项位掩码,0 = 默认
  # SB 未检出的帧,用经典检测器(classic)的角点填进 SB 路线的槽位兜底;
  # 每帧来源记在角点文件的 source 数组里("sb" = SB 本体检出,
  # "classic_fallback" = SB 未检出、classic 兜底填入,"" = 两法都未检出)。
  # false = 关闭兜底,行为与只有 SB 时完全一致(缺就缺)。
  # 依据(三轮实验诊断,见 corners 产物 review_sb_failed/DIAGNOSIS.md):
  # "缩小档救援 + 全分辨率精化"的产物与 classic 完全重合(偏差 0.01px 级),
  # 多尺度重试没有增量价值;classic 兜底更简单,还多覆盖 17 张穷举也救不回的帧。
  sb_fallback_classic: true
  subpix:
    # 亚像素精化(把角点位置从整数像素 refinement 到小数像素)的窗口粒度:
    # frame = 每帧一个窗口(帧内方格像素边长中位数推导,默认);
    # corner = 逐角点局部自适应(边缘强畸变处方格更小时用)
    window_granularity: frame
    min_win: 3                 # 半窗口下限(像素);窗口绝不允许 >= 方格像素边长(头号陷阱)
    max_iter: 30               # 精化迭代次数上限
    epsilon: 0.01              # 收敛容差:角点移动小于此值即停(像素)
  burst_check:
    # 同姿态连拍一致性断言(D-09):规范化后,同名角点在连拍内的位置波动
    # 中位数 < 0.05×方格像素边长 且 最大值 < 0.3×方格像素边长;
    # 超限说明排序被镜像/翻转污染(同名角点指向了棋盘对侧),该帧标记存疑。
    median_tol: 0.05
    max_tol: 0.3

# ---- 第③步:测噪声底(时域连拍 + 单帧估计 + 注入实验,CLI 零参数)----
noise:
  # Immerkaer 方法(用一个固定的 3×3 卷积核从单张照片估计像素噪声强度,
  # 不需要连拍)的主线口径:
  # std = 整图标准式(全部像素平均,纹理多的照片会偏高);
  # robust = 稳健中位数式(取中位数,天然压低纹理与 JPEG 压缩痕迹的权重)。
  # 默认 robust:真实 JPEG 图上更接近真实噪声底;两种估计值都会逐张落盘供对照
  immerkaer_variant: robust
  # 注入实验的 σ 网格上下限(单位:灰阶,即像素噪声标准差):
  # 往真实照片上加多强的噪声去探"像素噪声→角点误差"这条传递曲线。
  # 留空(null)= 自动锚定:下限 max(0.25, 实测中位数σ/4)、
  # 上限 min(128, 实测中位数σ×32)——覆盖实测噪声邻域并向上延伸到
  # 检测器失效区;也可写死正数(如 4.0 / 96.0)覆盖自动锚定
  injection_sigma_min: null
  injection_sigma_max: null
  # σ 对数网格档数:强到弱取多少档探曲线。8 档 = 研究定的折中
  # (档太少曲线拐点看不清,档太多纯浪费算力);合法范围 3–16。
  # 另有一个 σ=0 参照档自动加上,用于校准基线,不计入本数
  injection_n_levels: 8
  # 每档重复次数:同一张图同档 σ 加噪几次。注入噪声是随机的,重复几次
  # 取平均才压得住随机性;3 次起步、5 次封顶(再多收益趋平)
  injection_n_repeats: 4
  # 注入实验随机种子:加噪副本不落盘(几十 GB),靠 (图像, σ, 种子)
  # 三元组精确复现——同种子重跑结果逐位一致,这就是不落盘的正当性来源。
  # 换种子 = 换一批加噪副本,可用来检查结论稳不稳
  injection_seed: 20261018
  # 并行进程上限:注入实验按图像切任务并行跑,这里封顶同时用几个进程。
  # 默认 min(8, CPU 核数):给系统留核;写 1 = 不开子进程顺序跑(调试用);
  # 上限受本机核数硬性约束,配大了直接报错
  injection_max_workers: 8
  # 逐姿态 σ 汇成全局标量时用哪种统计量:
  # rms = 方均根(各姿态噪声按能量叠加,标量噪声假设下的自然聚合,推荐);
  # median = 中位数(个别离群姿态不拖总数)
  temporal_pooling: rms
  # 处理哪些数据划分:train 连拍 + test 独立照都算(开放问题 4 裁定,
  # 成本几乎为零,逐张来源标注);只想算训练集可改成 [train]
  noise_splits: [train, test]

# ---- 第④步:求解相机内参(模型矩阵 × 求解路径,CLI 零参数,全部在这里)----
calibrate:
  # 角点输入用哪条路线(D-02):sb = SB 检测为主 + classic 兜底的那份
  # (逐帧带 source 来源字段,705 张全覆盖);classic = 仅经典检测器那份,
  # 留作阶段四五对照,默认不进标定。
  corner_route: "sb"
  # 试车矩阵:四个内置模型一次跑齐(D-01 全矩阵)——
  # m1 针孔+4 畸变系数 / m2 针孔+5 系数(阶段一针孔基线)/
  # m3 针孔有理模型 / m4 鱼眼 KB4(阶段一鱼眼基线)
  models: [m1, m2, m3, m4]
  # 求解路径:opencv = OpenCV 原生求解;scipy = 拿 OpenCV 结果当初值,
  # 再用 scipy 最小二乘精化(残差只用模型层自己的投影函数,两把尺子可比)
  solvers: [opencv, scipy]
  # 存疑帧复核用哪个模型的精化结果做对照(D-04):标定收尾时自动把
  # 体检判"存疑"的照片与正常照片的逐帧重投影误差做全量对比(存疑组
  # vs 正常组),回答"看着糊的帧算起来是不是真的差"。固定一个模型
  # 全量对照,不逐模型重复;m2 = 阶段一针孔基线同款。可选 m1~m4。
  suspect_review_model: m2
  scipy:
    # 优化方法:只允许 trf(信赖域反射)。scipy 的 lm 只支持稠密雅可比
    # (雅可比 = 残差对参数的偏导数矩阵,稠密 = 全部元素都存),
    # 640 视图的稠密矩阵约 3.47 GB 内存,实测不可用——写 lm 直接报错防呆
    method: trf
    # 内部线性求解器:lsmr 是稀疏雅可比的标配搭配(trf 专属)
    tr_solver: lsmr
    # 损失核名单:linear 是主线(普通最小二乘,残差原样进代价);
    # soft_l1 是鲁棒核对照(把大残差的权重压低,看离群点是否在拖动整体)。
    # huber 也可配,系统性对比留到阶段四
    losses: [linear, soft_l1]
    # 鲁棒核的分界尺度:auto = 3 × 1.4826 × MAD(MAD = 用中位数衡量的
    # 初值残差波动),即残差大过波动 3 倍才开始被压低;也可写死 > 0 的数值
    f_scale: auto
    max_nfev: 300           # 函数评估次数上限(实测鲁棒核 300 次常"形式未收敛
                            # 但代价已到平台",判定另有实用收敛兜底,见求解器)
    ftol: 1.0e-10           # 残差变化容差:改善小于它就认为不再进步
    xtol: 1.0e-12           # 参数变化容差
    gtol: 1.0e-10           # 梯度容差(梯度 = 当前最陡下降方向的强度)
  # 鱼眼段仅供阶段一基线复现(baseline.py 仍读它);阶段二 M4 的 flags
  # 由模型适配器自带(= 10 = 每轮重算位姿 + skew 固定 0),不再读这里。
  fisheye:
    # 选项位掩码:2 = RECOMPUTE_EXTRINSIC(每轮迭代都重算棋盘的位姿)。
    # 实测(合成 KB4 数据回归):不加这一位时,OpenCV 只按初始内参算一次位姿、
    # 之后不随内参更新,会收敛到 RMS 高达上百像素的假结果——哪怕数据完美符合
    # KB4 模型。skew(倾斜因子)仍被估计(未加 8 = FIX_SKEW);
    # 若想对病态数据(让方程组接近无解的输入)硬报错,可再加 4 = CHECK_COND。
    flags: 2
    max_iter: 100              # 迭代次数上限
    epsilon: 1.0e-6            # 收敛容差

# ---- 第⑤步:算理论精度极限(Fisher 信息 / CRLB,CLI 零参数)----
# 白话:这一步在标定解的邻域把问题"拉直"(线性化),算 Fisher 信息矩阵
# (数据里"关于每个参数的信息量"的矩阵),取逆开方得到每个内参标准差
# 的理论下界(CRLB)——即"这批数据天生最准能到多少"。
fisher:
  # 算哪些模型的 CRLB:默认四个全跑(阶段二"全矩阵多存"风格,
  # 阶段四选型直接引用不回头补算,D-05)
  models: [m1, m2, m3, m4]
  # 条件数警戒线:条件数 = 信息矩阵"最软方向与最硬方向之比"(越大说明
  # 有些参数组合越难分辨)。达到警戒线记 warning(该组合方向上精度差)。
  # 必须 > 1(条件数恒 ≥ 1)且小于下面的退化线
  # (写法注意:yaml 里指数必须带符号,1.0e+4 才是数,1.0e4 会被当文字)
  cond_warning: 1.0e+4
  # 条件数退化线:达到它判 degenerate(当前摆位基本定不住这些参数组合,
  # 是要上报的发现);必须大于警戒线(分档有序)
  cond_degenerate: 1.0e+6
  # Σ 敏感性带的相对半宽:角点噪声 σ 由 8 张连拍估出时,标准差本身自带
  # 约 ±26.7% 的相对不确定度(8 样本相对标准误 1/√14),CRLB 随之乘
  # (1±半宽)落成"带"——报告输出带,不输出裸下界。合法范围 0 到 1
  sigma_band_rel: 0.267
  # 是否做线性化点敏感性检查:在 OpenCV 解的点上重算一遍 CRLB,与
  # scipy 精化点的结果比相对差(预期 <1%;差异大 = 解未收敛透的信号,
  # 作为发现记录,不阻塞)
  linearization_check: true
  # 是否做 OpenCV stdDev 交叉验证:把我们推导的精度界与 OpenCV 自己报的
  # 标准差对账(两套独立数学互相印证);这一步失败不阻塞 CRLB 主产物
  crosscheck_enabled: true

# ---- 第⑥步:防作弊考试(交叉验证 / bootstrap / 重复张分组 / 留一姿态,CLI 零参数)----
# 白话:这一步回答"这批参数换了没见过的照片还准不准"——把 80 个姿态反复
# 换着分组当"考题",每个相机模型都考一遍,配合参数稳定性与理论下界对照,
# 挑出当前数据下最合适的模型。
# 随机性的唯一来源是上面的全局 seed: 42——分折 / bootstrap 重采样 / 多起点
# 扰动的种子全部从它确定性推导,同配置重跑逐位一致(改 seed = 换一批考题)。
evaluate:
  # 参选模型(D-11):四个全部参选,不因 Fisher 退化预警预否决——
  # 若真过拟合,会在交叉验证的考题上自己显形
  models: [m1, m2, m3, m4]
  # 优化器对比的鲁棒核名单(D-14:4 核 × 4 模型全矩阵)。linear 是主线
  # 且必须包含——它是"其他核有没有更好"的归一参照;
  # cauchy 对离群残差的压制比 soft_l1 / huber 更狠
  optimizer_losses: [linear, soft_l1, huber, cauchy]
  # 交叉验证折数(D-01):80 姿态分 5 折,每折 16 个姿态当考题。
  # 必须 >= 2(1 折留不出考题)
  cv_n_folds: 5
  # 交叉验证重复轮数(D-01):换 5 种不同随机切分重复 5 轮,
  # 每个姿态恰好 5 次进验证,考出的分数才带误差棒
  cv_n_rounds: 5
  # bootstrap 重采样次数(D-04):按姿态有放回重采 100 次,
  # 4 个模型共用同一批重采样,参数稳定性的证据。
  # 100 的依据(2026-10-21 提速裁定):标准差本身的相对误差约 1/√(2×99)
  # ≈ 7%,对"参数位移当量 < 0.05 px"这种量级判定足够;200 次只把误差
  # 压到 5%,多花一倍算力(全实验近四成时间在 bootstrap)
  bootstrap_n: 100
  # 重复张分组实验开关(D-05):每姿态取第 i 张组成数据组独立标定,
  # 量"纯噪声"对参数的影响
  slice_enabled: true
  # 留一姿态实验开关(D-08):每次留 1 个姿态当考题、其余 79 个训练,
  # 误差离群者即"问题姿态"。
  # 2026-10-21 提速裁定:只对"候选模型"跑(选型选中的;没选出时取
  # 交叉验证考题误差最优者)——它是诊断不参与选型,4 模型全跑属重复证据
  lopo_enabled: true
  # 并行进程上限:实验按"一次完整标定求解"(秒级)切任务并行跑。
  # 写 1 = 不开子进程顺序跑(调试用);并行调度交给 joblib,不必卡核数写。
  # 12 的依据(2026-10-21 压测):每次求解约占 0.9 GB 内存,12 个约 11 GB,
  # 给桌面系统留余量;进程再多吞吐不再涨(内存带宽已饱和),反而挤爆内存
  # 触发硬盘顶替(swap,内存不够拿硬盘凑),把整机拖垮(实测负载 150+)
  evaluate_max_workers: 12
  # 温启动开关:交叉验证 / bootstrap / 留一姿态从 calib calibrate 的
  # 全量精化解出发只跑 scipy 精化,跳过从零的 OpenCV 求解。
  # 默认 false(2026-10-21 真实数据验证否决,4 模型 × 16 子集 62/64 对):
  # RMS 差全部 < 0.001 px,但内参位移当量中位 0.029 px、最大 0.224 px
  # (按多起点双容差 0.1 px 复核 6/62 对超线);耗时温启动中位 404 秒
  # vs 冷启动 332 秒,不提速反慢——沿 Fisher 软方向磨几百步才追平,
  # "秒级"只在合成小样成立。依据详见 docs/findings.md 结论 3
  # 代码保留(单元测试齐),需要 calib calibrate 的 <模型>__scipy 产物,
  # 缺了当场中文报错
  warm_start_experiments: false
  # 统计平局的等价带(D-09):两模型同折配对误差差落入
  # ±max(0.005 px, 较简模型均值的 2%)内判"统计平局",平局取更简模型。
  # 像素绝对带必须 > 0;相对带在 0 到 1 之间
  tie_band_px: 0.005
  tie_band_rel: 0.02
  # BIC 平局裁决器(D-10):只在统计平局时启用(BIC = 惩罚参数数量的
  # 模型比较量,越小越好),不做硬门槛
  bic_enabled: true
  # BIC 的有效样本数口径(D-10):锁定 80(有效姿态数),不写 640——
  # 640 会把复杂模型的惩罚弱化约 8 倍
  bic_n_poses: 80
  # 问题姿态的离群判据(D-08):留一姿态误差的稳健 z 分数(中位数绝对差
  # 标准化后的偏离程度)超过 3.5 判"问题姿态",与入库体检模糊度判据同源
  mad_z_threshold: 3.5
  # "实测好于理论下界"硬告警的两档显著性(D-06):分组实验实测的不确定度
  # 若低于同口径 CRLB 下界,物理上不可能,说明对照口径错了。
  # 0.01 = 硬告警判 FAIL;0.05 = 边缘提示。两者须在 0 到 0.5 之间且
  # hard < soft(告警线有序)。
  # 写法注意:yaml 里指数必须带符号(1.0e+4 才是数,1.0e4 会被当文字)
  crlb_alert_alpha_hard: 0.01
  crlb_alert_alpha_soft: 0.05
  # 泛化判据执行位:折级"验证误差 / 训练误差"比值的上限——比值超过它,
  # 过拟合显形即 FAIL(D-11 机制)。宽松默认 1.5,判行表同时呈现绝对数值
  gen_overfit_ratio_max: 1.5
  # 稳定判据执行位:参数扰动换算成典型视场投影位移的上限(像素当量)。
  # 宽松默认待真实数据校准后收紧
  stability_disp_px_max: 0.05
  # 多起点一致性检验(D-15):从 OpenCV 初值加随机扰动重复求解,
  # 验"解是不是唯一"。普通模型 10 次;鱼眼 m4 初值敏感,加倍到 20 次
  multistart_n: 10
  multistart_n_fisheye: 20
  # 多起点扰动幅度表(04-RESEARCH 定):内参相对 ±2%、畸变相对 ±10%、
  # 旋转约 1°、平移相对 ±2%,全部必须 > 0(幅度为零等于不扰动)
  multistart_intr_rel: 0.02
  multistart_dist_rel: 0.10
  multistart_rot_deg: 1.0
  multistart_trans_rel: 0.02
  # 多起点收敛判据的双容差:重投影 RMS 差 < 0.001 px 且参数位移当量
  # < 0.1 px,两条同时满足才算"收敛到同一解"
  multistart_rms_tol_px: 0.001
  multistart_param_tol_px: 0.1
  # ---- 运行档位与 test 选型(2026-10-21 选型重构)----
  # 运行档位,两档一套流程、只是缩不缩水的差别:
  #   quick = 日常默认:交付阶段先对全部模型算 test 整体 RMS 定出当选模型,
  #     之后的交叉验证 / 重采样 / 分组 / 留一只考当选模型,重复次数用下面的
  #     quick_* 覆盖(考得少一点);
  #   full = 新数据首轮 + 交付前终跑:全部模型全量重复(用上面的正式档
  #     重复次数),quick 结论存疑时回 full 复核
  profile: quick
  # quick 档的重复次数覆盖:交叉验证 3 折 × 3 轮、重采样 50 次
  quick_cv_n_folds: 3
  quick_cv_n_rounds: 3
  quick_bootstrap_n: 50
  # test 整体 RMS 选型的升级门槛:复杂度高一档的模型,在独立考题(test 集)
  # 上的整体 RMS 相对当前模型提升 >= 该比例才升级,否则停驻取更简者。
  # 0.10 的依据(docs/findings.md 结论 2):本批数据 m3/m4 只比 m2 好
  # 1.2%–1.9%,不够门槛,选 m2
  selection_improve_min: 0.10

# ---- 可视化与副本留痕 ----
visualization:
  jpeg_quality: 90             # 带标记副本的 JPEG 质量(可读性足够,磁盘省一半)
  mosaic:
    per_pose_sample: 1         # 汇总拼图每姿态抽几张
    worst_n: 20                # 指标最差的 N 张也进拼图(存疑优先看)
    thumb_width: 320           # 缩略图宽(像素)
    cols: 8                    # 拼图每行格数
