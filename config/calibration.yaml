# 相机标定全流程算法参数的唯一来源(D-12)
#
# 硬性规则:
# - 命令行不接受任何算法参数,所有默认值集中在本文件;
# - 换数据集/换棋盘规格只改配置不改代码;
# - 阈值类初值来自标准做法,首轮真实数据分布出来后由迭代回环校准(D-04):
#   人工审阅废帧清单 → 调整本文件 → 重跑受影响环节,每轮结果按时间戳留痕、跨轮可比。

# ---- 数据位置(相对当前工作目录)----
data:
  train: "input_data/train"   # 训练照片:每姿态一个子目录,目录名即姿态 ID
  test: "input_data/test"     # 测试照片:平铺,每张独立

# ---- 全局 ----
seed: 42                      # 随机种子(交叉验证切分、bootstrap 等),保证同配置可复现
cv2_threads: 0                # OpenCV 内部线程数;0 = 关闭 OpenCV 自己的多线程,
                              # 防止批量处理时占满所有核(并行交给上层显式控制)

# 人工剔除清单(D-03):input_data 只读,剔除永远是逻辑剔除。
# 人工审阅角点叠加图/废帧清单后,把要剔除的 image_id(文件名去扩展名)填在这里;
# 程序只在计算时跳过这些照片,绝不改动原始数据。
exclude_images: []

# ---- 第①步:入库体检 ----
ingest:
  precheck:
    # 模糊度:同姿态连拍内做稳健 z 分数(中位数绝对差 MAD,即用中位数衡量的偏离程度),
    # |z| 超过阈值判存疑。初值 3.5 来自统计惯例(约千分之二误报率),待首轮分布校准。
    blur_z_threshold: 3.5
    # 全局兜底分位线(单张姿态没有连拍可比,靠整批分位数兜底):
    # 指标低于 1% 分位或高于 99% 分位的照片标记存疑。初值待首轮分布校准。
    global_quantile_low: 0.01
    global_quantile_high: 0.99

# ---- 第②步:找棋盘角点 ----
corners:
  # 经典检测器 findChessboardCorners 的选项(按名字开,代码内翻译成 cv2 常量):
  # adaptive_thresh = 自适应阈值(光照不均时更稳);normalize_image = 先归一化亮度
  classic_flags: [adaptive_thresh, normalize_image]
  sb_flags: 0                  # 新款检测器 findChessboardCornersSB 的选项位掩码,0 = 默认
  # SB 未检出的帧,用经典检测器(classic)的角点填进 SB 路线的槽位兜底;
  # 每帧来源记在角点文件的 source 数组里("sb" = SB 本体检出,
  # "classic_fallback" = SB 未检出、classic 兜底填入,"" = 两法都未检出)。
  # false = 关闭兜底,行为与只有 SB 时完全一致(缺就缺)。
  # 依据(三轮实验诊断,见 corners 产物 review_sb_failed/DIAGNOSIS.md):
  # "缩小档救援 + 全分辨率精化"的产物与 classic 完全重合(偏差 0.01px 级),
  # 多尺度重试没有增量价值;classic 兜底更简单,还多覆盖 17 张穷举也救不回的帧。
  sb_fallback_classic: true
  subpix:
    # 亚像素精化(把角点位置从整数像素 refinement 到小数像素)的窗口粒度:
    # frame = 每帧一个窗口(帧内方格像素边长中位数推导,默认);
    # corner = 逐角点局部自适应(边缘强畸变处方格更小时用)
    window_granularity: frame
    min_win: 3                 # 半窗口下限(像素);窗口绝不允许 >= 方格像素边长(头号陷阱)
    max_iter: 30               # 精化迭代次数上限
    epsilon: 0.01              # 收敛容差:角点移动小于此值即停(像素)
  burst_check:
    # 同姿态连拍一致性断言(D-09):规范化后,同名角点在连拍内的位置波动
    # 中位数 < 0.05×方格像素边长 且 最大值 < 0.3×方格像素边长;
    # 超限说明排序被镜像/翻转污染(同名角点指向了棋盘对侧),该帧标记存疑。
    median_tol: 0.05
    max_tol: 0.3

# ---- 第④步:求解相机内参(鱼眼 KB4 路线)----
calibrate:
  fisheye:
    # 选项位掩码:2 = RECOMPUTE_EXTRINSIC(每轮迭代都重算棋盘的位姿)。
    # 实测(合成 KB4 数据回归):不加这一位时,OpenCV 只按初始内参算一次位姿、
    # 之后不随内参更新,会收敛到 RMS 高达上百像素的假结果——哪怕数据完美符合
    # KB4 模型。skew(倾斜因子)仍被估计(未加 8 = FIX_SKEW);
    # 若想对病态数据(让方程组接近无解的输入)硬报错,可再加 4 = CHECK_COND。
    flags: 2
    max_iter: 100              # 迭代次数上限
    epsilon: 1.0e-6            # 收敛容差

# ---- 可视化与副本留痕 ----
visualization:
  jpeg_quality: 90             # 带标记副本的 JPEG 质量(可读性足够,磁盘省一半)
  mosaic:
    per_pose_sample: 1         # 汇总拼图每姿态抽几张
    worst_n: 20                # 指标最差的 N 张也进拼图(存疑优先看)
    thumb_width: 320           # 缩略图宽(像素)
    cols: 8                    # 拼图每行格数
