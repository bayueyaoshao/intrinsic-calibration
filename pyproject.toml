[project]
name = "intrinsic-calibration"
version = "0.1.0"
description = "评估驱动的相机内参标定与精度评估框架:输入标定图像,输出可论证为当前数据下最优的内参与完整证据链报告"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # OpenCV 锁定 4.x 大版本:5.0(2026-08)刚发布,calib3d 行为易变,
    # 与"可审计、可复现的数值结果"冲突;等 5.x 攒够补丁版再评估迁移
    "opencv-python>=4.14,<5.0",
    # numpy 2.5 与 scipy 1.18 是成对验证过的组合,必须一起锁
    "numpy==2.5.*",
    "scipy==1.18.*",
    "typer>=0.15",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # D-10:numdifftools 只作测试里的数值基准(用差分近似核对解析导数),
    # 绝不进求解/理论计算路径——src/calib 里出现对它的引用就是违规,
    # 测试有 grep 锁定(阶段二 02-01 Task 3)
    "numdifftools>=0.11",
]

[project.scripts]
# calib 命令行入口:九个子命令(八个流水线阶段 + run-all 一键全流程)
calib = "calib.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # integration:标记需要真实数据(input_data/ 下 705 张照片)的慢速测试;
    # 日常开发用 -m "not integration" 跳过,合并前跑全量
    "integration: 需要真实 input_data 数据的慢速集成测试",
]

[tool.ruff]
line-length = 100
